services:
  api:
    build:
      context: ..
    command: uvicorn services.api-gateway.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://medikiosk:medikiosk@postgres/medikiosk
      MOCK_EXTERNAL_SERVICES: "true"
    depends_on: [postgres, redis, minio]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: medikiosk, POSTGRES_PASSWORD: medikiosk, POSTGRES_DB: medikiosk }
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
